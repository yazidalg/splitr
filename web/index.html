<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Stamps the theme class before first paint. Blocking on purpose: any
         async alternative shows a frame of the wrong theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('splitr-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Splitr: who owes what, and proof they've paid</title>
    <meta
      name="description"
      content="Splitr turns a messy group bill into one settled ledger. Split in seconds, chase no one, and let the Stellar ledger, not a screenshot, say who's square."
    />
    <meta name="theme-color" content="hsl(170, 40%, 98%)" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="hsl(180, 50%, 4%)" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Splitr: who owes what, and proof they've paid" />
    <meta
      property="og:description"
      content="Group bills settled in stablecoin on Stellar. Every payment carries its own memo, so the ledger says who's paid."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The same three-share disc as the <Mark> component, inlined so the tab
         icon costs no request. Transparent rather than on a dark plate: the
         teal holds up against both a light and a dark browser chrome, and a
         plate would only match one of them. Keep this in step with
         `web/src/components/Icons.tsx`. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cmask id='m'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M16 16V1M16 16L3 23.5M16 16L29 23.5' stroke='%23000' stroke-width='1.7' fill='none'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23000'/%3E%3C/mask%3E%3Ccircle cx='16' cy='16' r='13' fill='%2300B392' mask='url(%23m)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
